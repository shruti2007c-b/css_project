<!DOCTYPE html>
<html lang="en" ng-app="contactApp">
<head>
    <meta charset="UTF-8">
    <title>Contact Book</title>

    <!-- AngularJS -->
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>

    <!-- Icons -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <link rel="stylesheet" href="style.css">
</head>

<body ng-controller="ContactController">

<!-- NAVBAR -->
<div class="navbar">
    <span class="title">Contacts</span>

    <div class="nav-icons">
        <i class="fa fa-search" ng-click="toggleSearch()"></i>
        <i class="fa fa-plus" ng-click="goToAdd()"></i>
    </div>
</div>

<!-- SEARCH BAR -->
<input type="text" class="search-bar"
       placeholder="Search contacts..."
       ng-model="searchText"
       ng-show="showSearch">

<!-- CONTACT LIST PAGE -->
<div class="page" ng-show="currentPage === 'list'">

    <div class="contact-card"
         ng-repeat="c in contacts | filter:searchText">

        <div class="avatar">{{ c.name.charAt(0) }}</div>

        <div class="details">
            <h4>{{ c.name }}</h4>
            <p>{{ c.mobile }}</p>
        </div>

        <div class="actions">
            <i class="fa fa-pen" ng-click="editContact($index)"></i>
            <i class="fa fa-trash" ng-click="deleteContact($index)"></i>
        </div>
    </div>

    <p class="empty" ng-if="contacts.length === 0">
        No Contacts Found
    </p>
</div>

<!-- ADD / EDIT CONTACT PAGE -->
<div class="page" ng-show="currentPage === 'form'">

    <div class="form-header">
        <i class="fa fa-arrow-left" ng-click="goBack()"></i>
        <span>{{ editMode ? 'Edit Contact' : 'Add Contact' }}</span>
    </div>

    <form ng-submit="saveContact()">

        <input type="text" placeholder="Contact Name"
               ng-model="contact.name">

        <input type="text" placeholder="Mobile Number"
               ng-model="contact.mobile">

        <input type="email" placeholder="Email Address"
               ng-model="contact.email">

        <textarea placeholder="Address"
                  ng-model="contact.address"></textarea>

        <button type="submit">
            {{ editMode ? 'Update Contact' : 'Save Contact' }}
        </button>

        <p class="error" ng-if="errorMsg">{{ errorMsg }}</p>

    </form>
</div>

<script src="app.js"></script>
</body>
</html>
