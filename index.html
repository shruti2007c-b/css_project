<!DOCTYPE html>
<html lang="en" ng-app="contactApp">
<head>
    <meta charset="UTF-8">
    <title>AngularJS Contact Book</title>

    <!-- AngularJS CDN -->
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <script src="app.js"></script>

    <style>
        body {
            font-family: Arial;
            background: #f4f6f9;
            padding: 20px;
        }
        h2 {
            text-align: center;
        }
        input {
            padding: 8px;
            margin: 5px;
        }
        button {
            padding: 8px 12px;
            margin: 5px;
            cursor: pointer;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: white;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
        }
        th {
            background: #007bff;
            color: white;
        }
    </style>
</head>

<body ng-controller="ContactController">

<h2>📒 AngularJS Contact Book</h2>

<!-- Contact Form -->
<input type="text" ng-model="contact.name" placeholder="Name">
<input type="text" ng-model="contact.phone" placeholder="Phone">
<input type="email" ng-model="contact.email" placeholder="Email">

<button ng-click="saveContact()">
    {{ editIndex === -1 ? 'Add Contact' : 'Update Contact' }}
</button>

<!-- Contact List -->
<table ng-if="contacts.length > 0">
    <tr>
        <th>#</th>
        <th>Name</th>
        <th>Phone</th>
        <th>Email</th>
        <th>Actions</th>
    </tr>

    <tr ng-repeat="c in contacts track by $index">
        <td>{{$index + 1}}</td>
        <td>{{c.name}}</td>
        <td>{{c.phone}}</td>
        <td>{{c.email}}</td>
        <td>
            <button ng-click="editContact($index)">Edit</button>
            <button ng-click="deleteContact($index)">Delete</button>
        </td>
    </tr>
</table>

<p ng-if="contacts.length === 0" style="text-align:center;">
    No contacts found
</p>

</body>
</html>
